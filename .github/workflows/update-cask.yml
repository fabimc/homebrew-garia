name: Update cask

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Garia release tag (empty = latest published)
        required: false
  repository_dispatch:
    types: [garia-released]
  schedule:
    - cron: "17 15 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pin cask to the published DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.event.client_payload.tag || '' }}
        run: ./scripts/update-cask.sh ${TAG}

      - name: Commit if the cask changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/garia.rb
          if git diff --cached --quiet; then
            echo "Cask already matches the latest release."
            exit 0
          fi
          version="$(sed -n 's/^  version "\(.*\)"/\1/p' Casks/garia.rb | head -n1)"
          git commit -m "Update garia to ${version}"
          git push
